<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Multiplicación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-image: url('fondo.png');
            background-repeat: no-repeat;
            background-position: center 100px; /* 👈 Ajusta esta posición (más abajo) */
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Si el fondo sigue muy arriba, prueba con: */
        /* background-position: center 150px; o background-position: center bottom; */

        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
        }

        .points, .level {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 30px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .title {
            text-align: center;
            color: #FFD700;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            font-size: 2.5em;
        }

        .game-board {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            margin: 20px auto;
            max-width: 800px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 4px solid #667eea;
        }

        .question {
            font-size: 3em;
            text-align: center;
            color: #333;
            margin: 30px 0;
            font-weight: bold;
        }

        .answers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .answer-btn {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            border: none;
            padding: 30px;
            font-size: 2em;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .answer-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .answer-btn:active {
            transform: translateY(0);
        }

        .answer-btn.correct {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }

        .answer-btn.incorrect {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .mission-panel {
            background: rgba(102, 126, 234, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            color: white;
        }

        .challenge {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            text-align: center;
        }

        .result-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .result-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .result-content h2 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #FFD700;
        }

        .stars {
            font-size: 4em;
            margin: 20px 0;
        }

        .play-again {
            background: #FFD700;
            color: #333;
            border: none;
            padding: 20px 40px;
            font-size: 1.5em;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .play-again:hover {
            transform: scale(1.1);
        }

        /* Control de música */
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(102, 126, 234, 0.9);
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .music-control:hover {
            background: rgba(102, 126, 234, 1);
        }

        @media (max-width: 768px) {
            .answers {
                grid-template-columns: 1fr;
            }
            
            .question {
                font-size: 2em;
            }
            
            .answer-btn {
                padding: 20px;
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <!-- Música de fondo -->
    <audio id="musicaFondo" loop>
        <source src="musica.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    </audio>

    <!-- Botón para controlar música -->
    <div class="music-control" onclick="toggleMusic()" title="Activar/Desactivar música">
        🎵
    </div>

    <div class="game-container">
        <div class="header">
            <div class="points">PUNTOS: <span id="puntos">0</span></div>
            <h1 class="title"> MISIÓN MULTIPLICACIÓN 🚀</h1>
            <div class="level">NIVEL: <span id="nivel">1</span>/3</div>
        </div>

        <div class="mission-panel">
            <h3>📡 TU MISIÓN</h3>
            <div class="challenge" id="reto1">✅ RETO 1</div>
            <div class="challenge" id="reto2"> RETO 2</div>
            <div class="challenge" id="reto3">🔒 RETO 3</div>
        </div>

        <div class="game-board">
            <div id="gameContent">
                <div class="question" id="pregunta">Preparando misión...</div>
                <div class="answers" id="respuestas"></div>
            </div>
        </div>
    </div>

    <!-- Pantalla de resultados -->
    <div class="result-screen" id="resultScreen">
        <div class="result-content">
            <h2>🎉 ¡MISIÓN COMPLETADA! 🎉</h2>
            <div class="stars" id="starsDisplay">⭐⭐⭐</div>
            <p style="font-size: 1.5em;">¡Has conseguido las 3 estrellas!</p>
            <p style="font-size: 2em; margin: 20px 0;">🏆 Puntaje: <span id="finalScore">0</span></p>
            <button class="play-again" onclick="jugarDeNuevo()">🔄 JUGAR DE NUEVO</button>
        </div>
    </div>

    <script>
        // Variables del juego
        let puntos = 0;
        let nivelActual = 1;
        let retosCompletados = 0;
        let preguntaActual = 0;
        let musicaReproduciendo = false;

        // Base de datos de preguntas por nivel
        const preguntasPorNivel = {
            1: [ // Nivel 1: Tablas del 1-5
                { p: "2 × 3", r: 6, opciones: [6, 5, 8, 4] },
                { p: "4 × 2", r: 8, opciones: [8, 6, 9, 7] },
                { p: "3 × 4", r: 12, opciones: [12, 10, 14, 11] },
                { p: "5 × 3", r: 15, opciones: [15, 12, 18, 14] },
                { p: "4 × 4", r: 16, opciones: [16, 14, 18, 15] }
            ],
            2: [ // Nivel 2: Tablas del 6-9
                { p: "6 × 7", r: 42, opciones: [42, 40, 44, 38] },
                { p: "8 × 6", r: 48, opciones: [48, 46, 50, 44] },
                { p: "7 × 9", r: 63, opciones: [63, 61, 65, 58] },
                { p: "9 × 8", r: 72, opciones: [72, 70, 74, 68] },
                { p: "7 × 7", r: 49, opciones: [49, 47, 51, 45] }
            ],
            3: [ // Nivel 3: Mezcla difícil
                { p: "12 × 8", r: 96, opciones: [96, 94, 98, 92] },
                { p: "15 × 6", r: 90, opciones: [90, 88, 92, 85] },
                { p: "11 × 9", r: 99, opciones: [99, 97, 101, 95] },
                { p: "13 × 7", r: 91, opciones: [91, 89, 93, 87] },
                { p: "14 × 8", r: 112, opciones: [112, 110, 114, 108] }
            ]
        };

        let preguntasNivel = [];

        // Iniciar juego
        function iniciarJuego() {
            puntos = 0;
            nivelActual = 1;
            retosCompletados = 0;
            actualizarPuntaje();
            cargarNivel(nivelActual);
            
            // Intentar reproducir música
            const musica = document.getElementById('musicaFondo');
            musica.volume = 0.5;
            musica.play().then(() => {
                musicaReproduciendo = true;
            }).catch(e => {
                console.log("Autoplay bloqueado - el usuario debe interactuar primero");
            });
        }

        // Control de música
        function toggleMusic() {
            const musica = document.getElementById('musicaFondo');
            if (musicaReproduciendo) {
                musica.pause();
                musicaReproduciendo = false;
            } else {
                musica.play();
                musicaReproduciendo = true;
            }
        }

        // Cargar nivel
        function cargarNivel(nivel) {
            preguntasNivel = [...preguntasPorNivel[nivel]];
            preguntaActual = 0;
            document.getElementById('nivel').textContent = nivel;
            mostrarPregunta();
        }

        // Mostrar pregunta
        function mostrarPregunta() {
            if (preguntaActual >= preguntasNivel.length) {
                completarReto();
                return;
            }

            const pregunta = preguntasNivel[preguntaActual];
            document.getElementById('pregunta').textContent = pregunta.p + " = ?";
            
            const respuestasDiv = document.getElementById('respuestas');
            respuestasDiv.innerHTML = '';
            
            // Mezclar opciones
            const opcionesMezcladas = [...pregunta.opciones].sort(() => Math.random() - 0.5);
            
            opcionesMezcladas.forEach(opcion => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = opcion;
                btn.onclick = () => verificarRespuesta(opcion, pregunta.r, btn);
                respuestasDiv.appendChild(btn);
            });
        }

        // Verificar respuesta
        function verificarRespuesta(respuesta, correcta, btn) {
            const botones = document.querySelectorAll('.answer-btn');
            botones.forEach(b => b.disabled = true);
            
            if (respuesta === correcta) {
                btn.classList.add('correct');
                puntos += 10;
                actualizarPuntaje();
                setTimeout(() => {
                    preguntaActual++;
                    mostrarPregunta();
                }, 1000);
            } else {
                btn.classList.add('incorrect');
                botones.forEach(b => {
                    if (parseInt(b.textContent) === correcta) {
                        b.classList.add('correct');
                    }
                });
                setTimeout(() => {
                    preguntaActual++;
                    mostrarPregunta();
                }, 1500);
            }
        }

        // Completar reto
        function completarReto() {
            retosCompletados++;
            document.getElementById(`reto${retosCompletados}`).innerHTML = '✅ RETO ' + retosCompletados;
            
            if (retosCompletados < 3) {
                nivelActual++;
                document.getElementById(`reto${nivelActual}`).innerHTML = '🚀 RETO ' + nivelActual + ' - EN PROGRESO';
                setTimeout(() => {
                    cargarNivel(nivelActual);
                }, 1500);
            } else {
                mostrarResultados();
            }
        }

        // Actualizar puntaje
        function actualizarPuntaje() {
            document.getElementById('puntos').textContent = puntos;
        }

        // Mostrar resultados
        function mostrarResultados() {
            const resultScreen = document.getElementById('resultScreen');
            const finalScore = document.getElementById('finalScore');
            const starsDisplay = document.getElementById('starsDisplay');
            
            finalScore.textContent = puntos;
            
            // Calcular estrellas
            let estrellas = '⭐';
            if (puntos >= 100) estrellas = '⭐⭐⭐';
            else if (puntos >= 70) estrellas = '⭐⭐';
            
            starsDisplay.textContent = estrellas;
            resultScreen.style.display = 'flex';
        }

        // Jugar de nuevo
        function jugarDeNuevo() {
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('reto1').innerHTML = '🔒 RETO 1';
            document.getElementById('reto2').innerHTML = '🔒 RETO 2';
            document.getElementById('reto3').innerHTML = '🔒 RETO 3';
            iniciarJuego();
        }

        // Iniciar al cargar
        window.onload = iniciarJuego;
    </script>
</body>
</html>
