<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #070b45;
}

/* =========================================================
   CONTENEDOR PRINCIPAL
========================================================= */

#juego {
    position: relative;
    width: 100vw;
    height: 100vh;

    background-image: url("fondo.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    overflow: hidden;
}

/* =========================================================
   PUNTOS
========================================================= */

#panelPuntos {
    position: absolute;

    left: 2.2%;
    top: 3.5%;

    width: 15%;
    height: 10%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    text-align: center;

    font-weight: bold;
    text-shadow: 2px 2px 3px #000;

    pointer-events: none;
}

#textoPuntos {
    font-size: clamp(18px, 2.2vw, 42px);
    line-height: 1.1;
}

#textoPuntos small {
    display: block;
    font-size: clamp(10px, 1.1vw, 20px);
    color: #ffffff;
}

/* =========================================================
   NIVEL
========================================================= */

#panelNivel {
    position: absolute;

    right: 14.5%;
    top: 3.5%;

    width: 12%;
    height: 10%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-size: clamp(18px, 2.2vw, 40px);

    font-weight: bold;

    text-shadow: 2px 2px 3px #000;

    pointer-events: none;
}

/* =========================================================
   ZONA DE PREGUNTA
========================================================= */

#pregunta {
    position: absolute;

    left: 12%;
    top: 28%;

    width: 68%;
    height: 25%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 3%;

    text-align: center;

    color: #10215f;

    font-size: clamp(20px, 2.4vw, 48px);

    font-weight: bold;

    line-height: 1.25;

    overflow-y: auto;
}

/* =========================================================
   INDICADOR TIPO DE PREGUNTA
========================================================= */

#tipoPregunta {
    position: absolute;

    left: 35%;
    top: 24%;

    width: 30%;
    height: 7%;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;

    font-size: clamp(14px, 1.5vw, 28px);

    font-weight: bold;

    text-shadow: 2px 2px 3px #000;

    pointer-events: none;
}

/* =========================================================
   BOTONES DE RESPUESTA
========================================================= */

#respuestas {
    position: absolute;

    left: 15%;
    bottom: 8%;

    width: 63%;

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 2%;
}

.botonRespuesta {

    width: 100%;

    min-height: 9vh;

    border: 4px solid #65eaff;

    border-radius: 20px;

    background: linear-gradient(
        145deg,
        #8c2cff,
        #5420bd
    );

    color: white;

    font-size: clamp(20px, 3vw, 55px);

    font-weight: bold;

    text-shadow: 2px 2px 3px #26005d;

    box-shadow:
        0 8px 0 #25127a,
        0 0 15px #00eaff;

    cursor: pointer;

    transition:
        transform 0.12s,
        box-shadow 0.12s,
        filter 0.12s;
}

.botonRespuesta:active {

    transform: translateY(7px) scale(0.97);

    box-shadow:
        0 2px 0 #25127a,
        0 0 20px #ffffff;
}

.botonRespuesta:hover {
    filter: brightness(1.18);
}

/* =========================================================
   PANEL TU MISIÓN
========================================================= */

#panelMision {

    position: absolute;

    right: 2.5%;
    top: 23%;

    width: 15.5%;
    height: 43%;

    pointer-events: none;
}

/*
   Las estrellas son elementos independientes.
   Se colocan encima del fondo.
*/

.estrellaMision {

    position: absolute;

    width: 27%;

    height: auto;

    object-fit: contain;

    opacity: 0.25;

    filter:
        grayscale(1)
        brightness(0.7);

    transition:
        opacity 0.5s,
        filter 0.5s,
        transform 0.5s;
}

/* Posiciones */

#estrella1 {
    left: 8%;
    top: 20%;
}

#estrella2 {
    left: 8%;
    top: 39%;
}

#estrella3 {
    left: 8%;
    top: 58%;
}

/* ESTRELLA CONSEGUIDA */

.estrellaMision.activa {

    opacity: 1;

    filter:
        drop-shadow(0 0 8px #fff)
        drop-shadow(0 0 18px #ffd700);

    transform:
        scale(1.12)
        rotate(5deg);

    animation: estrellaGanada 0.7s ease;
}

@keyframes estrellaGanada {

    0% {
        transform: scale(0.2) rotate(-40deg);
        opacity: 0;
    }

    60% {
        transform: scale(1.3) rotate(10deg);
        opacity: 1;
    }

    100% {
        transform: scale(1.12) rotate(5deg);
    }
}

/* =========================================================
   ERROR
========================================================= */

#errorLuz {

    position: absolute;

    right: 5.2%;
    top: 76%;

    width: 5%;

    aspect-ratio: 1 / 1;

    border-radius: 50%;

    background: #551111;

    border: 4px solid #ff5757;

    box-shadow:
        0 0 5px #ff0000;

    opacity: 0.35;

    transition:
        opacity 0.2s,
        box-shadow 0.2s;
}

#errorLuz.activo {

    opacity: 1;

    background: #ff2020;

    box-shadow:
        0 0 10px #ff0000,
        0 0 25px #ff0000,
        0 0 40px #ff5555;

    animation: errorParpadeo 0.8s ease;
}

@keyframes errorParpadeo {

    0%, 100% {
        transform: scale(1);
    }

    25% {
        transform: scale(1.3);
    }

    50% {
        transform: scale(0.9);
    }

    75% {
        transform: scale(1.25);
    }
}

/* =========================================================
   MENSAJE
========================================================= */

#mensaje {

    left: 20%;
    top: 67%;

    width: 55%;

    text-align: center;

    color: white;

    transition: opacity 0.3s;

#mensaje.visible {

/* =========================================================

========================================================= */

#btnBluetooth {

    right: 1.8%;
    top: 3%;

    border: 3px solid white;

    background: linear-gradient(

        #083b9e

    color: white;

    font-size: clamp(16px, 2vw, 35px);

    box-shadow:

#btnBluetooth:active {

/* =========================================================

========================================================= */

#estadoBluetooth {

#estadoBluetooth.conectado {

#estadoBluetooth.desconectado {

/* =========================================================

========================================================= */

#pantallaFinal {

    justify-content: center;

/* =========================================================

/* =========================================================
   VARIABLES DEL JUEGO
========================================================= */

let nivelActual = 1;

let puntos = 0;

let preguntaActual = null;

let preguntasUsadas = [];

let juegoTerminado = false;


/* =========================================================
   ELEMENTOS HTML
========================================================= */

const preguntaElemento =
    document.getElementById("pregunta");

const botones =
    document.querySelectorAll(".botonRespuesta");

const puntosElemento =
    document.getElementById("puntos");

const nivelElemento =
    document.getElementById("nivel");

const mensajeElemento =

const errorLuz =

    document.getElementById("estrella3");

const estadoBluetooth =
    document.getElementById("estadoBluetooth");


/* =========================================================
   INICIAR JUEGO
========================================================= */

function iniciarJuego() {

    nivelActual = 1;

    puntos = 0;

    juegoTerminado = false;

    preguntasUsadas = [];

    puntosElemento.textContent = "0";

    nivelElemento.textContent = "1 / 3";

    pantallaFinal.classList.remove("visible");

    estrella1.classList.remove("activa");
    estrella2.classList.remove("activa");
    estrella3.classList.remove("activa");

    errorLuz.classList.remove("activo");

    siguientePregunta();

}


/* =========================================================
   BUSCAR PREGUNTA ALEATORIA
========================================================= */

function obtenerPreguntaAleatoria(nivel) {

    const disponibles =
        bancoPreguntas.filter(
            pregunta =>
                pregunta.nivel === nivel &&
                !preguntasUsadas.includes(pregunta)
        );

    if (disponibles.length === 0) {

        preguntasUsadas =
            preguntasUsadas.filter(
                pregunta =>
                    pregunta.nivel !== nivel
            );

        return obtenerPreguntaAleatoria(nivel);
    }

    const indice =
        Math.floor(
            Math.random() * disponibles.length
        );

    const seleccion =
        disponibles[indice];

    preguntasUsadas.push(seleccion);

    return seleccion;
}


/* =========================================================
   SIGUIENTE PREGUNTA
========================================================= */

function siguientePregunta() {

    if (nivelActual > 3) {

        finalizarJuego();

        return;
    }

    preguntaActual =
        obtenerPreguntaAleatoria(nivelActual);

    nivelElemento.textContent =
        nivelActual + " / 3";

    preguntaElemento.textContent =
        preguntaActual.pregunta;

    mensajeElemento.classList.remove("visible");

    crearRespuestas();

}


/* =========================================================
   CREAR RESPUESTAS
========================================================= */

function crearRespuestas() {

    const correcta =
        preguntaActual.respuesta;

    const respuestas =
        generarRespuestas(correcta);

    /* Mezclar */

    respuestas.sort(
        () => Math.random() - 0.5
    );

    botones.forEach(
        (boton, indice) => {

            boton.textContent =
                respuestas[indice];

            boton.disabled = false;

        }
    );
}


/* =========================================================
   GENERAR RESPUESTAS INCORRECTAS
========================================================= */

function generarRespuestas(correcta) {

    const respuestas =
        new Set();

    respuestas.add(correcta);

    while (respuestas.size < 4) {

        let diferencia;

        if (nivelActual === 1) {

            diferencia =
                Math.floor(
                    Math.random() * 20
                ) + 5;

        } else if (nivelActual === 2) {

            diferencia =
                Math.floor(
                    Math.random() * 50
                ) + 10;

        } else {

            diferencia =
                Math.floor(
                    Math.random() * 300
                ) + 50;
        }

        const signo =
            Math.random() < 0.5
                ? -1
                : 1;

        let incorrecta =
            correcta +
            diferencia * signo;

        if (incorrecta > 0) {

            respuestas.add(incorrecta);
        }
    }

    return Array.from(respuestas);
}


/* =========================================================
   RESPONDER
========================================================= */

function responder(indice) {

    if (juegoTerminado) {
        return;
    }

    const valor =
        Number(
            botones[indice].textContent
        );

    if (
        valor ===
        preguntaActual.respuesta
    ) {

        respuestaCorrecta();

    } else {

        respuestaIncorrecta();
    }
}


/* =========================================================
   RESPUESTA CORRECTA
========================================================= */

function respuestaCorrecta() {

    botones.forEach(
        boton =>
            boton.disabled = true
    );

    puntos += 100;

    puntosElemento.textContent =
        puntos;

    mostrarMensaje(
        "⭐ ¡CORRECTO! +100 PUNTOS"
    );

    activarEstrella(nivelActual);

    /*
       Enviar señal al ESP32
    */

    enviarBluetooth(
        "Q" + nivelActual + "_OK"
    );


    setTimeout(() => {

        nivelActual++;

        if (nivelActual <= 3) {

            siguientePregunta();

        } else {

            finalizarJuego();

        }

    }, 1500);
}


/* =========================================================
   ACTIVAR ESTRELLA
========================================================= */

function activarEstrella(nivel) {

    if (nivel === 1) {

        estrella1.classList.add("activa");

    }

    if (nivel === 2) {

        estrella2.classList.add("activa");

    }

    if (nivel === 3) {

        estrella3.classList.add("activa");

    }
}


/* =========================================================
   RESPUESTA INCORRECTA
========================================================= */

function respuestaIncorrecta() {

    /*
       No quitamos puntos.
       El alumno puede volver a intentarlo.
    */

    mostrarMensaje(
        "❌ ¡Casi! Intenta nuevamente"
    );

    errorLuz.classList.remove("activo");

    /*
       Forzar reinicio de animación
    */

    void errorLuz.offsetWidth;

    errorLuz.classList.add("activo");

    /*
       Enviar ERROR al ESP32
    */

    enviarBluetooth("ERROR");

    setTimeout(() => {

        errorLuz.classList.remove(
            "activo"
        );

    }, 1000);
}


/* =========================================================
   MOSTRAR MENSAJE
========================================================= */

function mostrarMensaje(texto) {

    mensajeElemento.textContent =
        texto;

    mensajeElemento.classList.add(
        "visible"
    );
}


/* =========================================================
   FINALIZAR JUEGO
========================================================= */

function finalizarJuego() {

    juegoTerminado = true;

    puntajeFinal.textContent =
        puntos;

    pantallaFinal.classList.add(
        "visible"
    );

    enviarBluetooth(
        "Q3_OK"
    );
}


/* =========================================================
   REINICIAR
========================================================= */

function reiniciarJuego() {

    enviarBluetooth(
        "RESET"
    );

    iniciarJuego();
}


/* =========================================================
   BLUETOOTH BLE
========================================================= */

async function conectarBluetooth() {

    /*
       Verificar soporte
    */

    // Bluetooth es OPCIONAL: el juego funciona completamente sin conectarlo.
    if (!navigator.bluetooth) {
        estadoBluetooth.textContent = "Bluetooth no disponible";
        estadoBluetooth.className = "desconectado";
        return;
    }


    try {

        estadoBluetooth.textContent =
            "Buscando ESP32...";

        estadoBluetooth.className = "";


        /*
           Solicitar dispositivo
        */

        dispositivoBLE =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        namePrefix: "ESP32"
                    }
                ],

                optionalServices: [
                    SERVICE_UUID
                ]

            });


        estadoBluetooth.textContent =
            "Conectando...";


        /*
           Conectarse al ESP32
        */

        const servidor =
            await dispositivoBLE.gatt.connect();


        /*
           Obtener servicio
        */

        const servicio =
            await servidor.getPrimaryService(
                SERVICE_UUID
            );


        /*
           Obtener característica
        */

        caracteristicaBLE =
            await servicio.getCharacteristic(
                CHARACTERISTIC_UUID
            );


        /*
           Estado conectado
        */

        estadoBluetooth.textContent =
            "Bluetooth conectado";

        estadoBluetooth.className =
            "conectado";


        /*
           Si se pierde la conexión
        */

        dispositivoBLE.addEventListener(
            "gattserverdisconnected",
            bluetoothDesconectado
        );


        /*
           Enviar RESET al conectar
        */

        enviarBluetooth("RESET");


    } catch (error) {

        console.error(
            "Error Bluetooth:",
            error
        );

        estadoBluetooth.textContent =
            "Desconectado";

        estadoBluetooth.className =
            "desconectado";
    }
}


/* =========================================================
   BLUETOOTH DESCONECTADO
========================================================= */

function bluetoothDesconectado() {

    estadoBluetooth.textContent =
        "Bluetooth desconectado";

    estadoBluetooth.className =
        "desconectado";

    dispositivoBLE = null;

    caracteristicaBLE = null;
}


/* =========================================================
   ENVIAR DATOS AL ESP32
========================================================= */

async function enviarBluetooth(mensaje) {

    /*
       Si todavía no está conectado,
       simplemente no enviamos.
    */

    // Si no hay Bluetooth conectado, simplemente continuamos el juego.
    if (!caracteristicaBLE) {
        console.log("Bluetooth no conectado. Juego continúa normalmente:", mensaje);
        return;
    }


    try {

        const datos =
            new TextEncoder().encode(
                mensaje
            );


        await caracteristicaBLE
            .writeValue(datos);


        console.log(
            "Enviado al ESP32:",
            mensaje
        );


    } catch (error) {

        console.error(
            "Error enviando Bluetooth:",
            error
        );
    }
}


/* =========================================================
   MÚSICA DE FONDO
========================================================= */

const musicaFondo = document.getElementById("musicaFondo");
musicaFondo.volume = 0.35;

function iniciarMusica() {
    const promesa = musicaFondo.play();
    if (promesa !== undefined) {
        promesa.catch(() => {
            // El navegador puede bloquear el autoplay.
            // La música comenzará en cuanto el usuario toque/clickee la pantalla.
        });
    }
}

// Intentar iniciar al cargar y nuevamente con la primera interacción.
window.addEventListener("load", iniciarMusica);
["click", "touchstart", "keydown"].forEach(evento => {
    document.addEventListener(evento, iniciarMusica, { once: true });
});

// Si musica.mp3 no existe, probar automáticamente con fondo.mp3.
musicaFondo.addEventListener("error", () => {
    if (!musicaFondo.dataset.fallback) {
        musicaFondo.dataset.fallback = "1";
        musicaFondo.src = "fondo.mp3";
        musicaFondo.load();
        iniciarMusica();
    }
});

/* =========================================================
   INICIO AUTOMÁTICO
========================================================= */

window.addEventListener(
    "load",
    () => {

        iniciarJuego();

    }
);

</script>
