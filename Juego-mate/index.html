<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Misión Multiplicación</title>


<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#070b45;
}

#juego{
    position:relative;
    width:100vw;
    height:100vh;
    background-image:url("fondo.png");
    background-size:100% 100%;
    background-position:center;
    background-repeat:no-repeat;
    overflow:hidden;
}

/* =========================================================
   PUNTOS Y NIVEL
   El fondo ya contiene las etiquetas PUNTOS y NIVEL.
   Aquí solo se muestra el valor dinámico.
========================================================= */

#panelPuntos{
    position:absolute;
    left:2.2%;
    top:5.2%;
    width:14.2%;
    height:6.3%;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:10;
}

#textoPuntos{
    width:82%;
    height:92%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:clamp(24px,2.65vw,48px);
    line-height:1;
    font-weight:900;
    text-align:center;
    text-shadow:2px 3px 3px #000;
    background:linear-gradient(180deg,#3215c9,#18058e);
    border-radius:14px;
    box-shadow:inset 0 0 8px rgba(255,255,255,.18);
}

#textoPuntos small{display:none;}

#panelNivel{
    position:absolute;
    right:14.4%;
    top:5.2%;
    width:11.8%;
    height:6.3%;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:10;
}

#nivel{
    display:flex;
    align-items:center;
    justify-content:center;
    width:86%;
    height:92%;
    color:white;
    font-size:clamp(24px,2.55vw,46px);
    line-height:1;
    font-weight:900;
    text-shadow:2px 3px 3px #000;
    background:linear-gradient(180deg,#3215c9,#18058e);
    border-radius:14px;
    box-shadow:inset 0 0 8px rgba(255,255,255,.18);
}

/* =========================================================
   BLUETOOTH
========================================================= */

#btnBluetooth{
    position:absolute;
    right:1.2%;
    top:16%;
    width:4.2%;
    min-width:38px;
    aspect-ratio:1/1;
    border-radius:50%;
    border:3px solid white;
    background:linear-gradient(145deg,#1976ff,#083b9e);
    color:white;
    font-size:clamp(14px,1.5vw,28px);
    cursor:pointer;
    box-shadow:0 0 12px #00bfff;
    z-index:30;
}

#btnBluetooth:active{transform:scale(.92);}

#estadoBluetooth{
    position:absolute;
    right:.5%;
    top:21%;
    width:6%;
    min-width:65px;
    text-align:center;
    color:#ff7070;
    font-size:clamp(8px,.75vw,14px);
    font-weight:bold;
    text-shadow:1px 1px 2px #000;
    z-index:30;
}

#estadoBluetooth.conectado{color:#5cff5c;}
#estadoBluetooth.desconectado{color:#ff7070;}

/* =========================================================
   TIPO Y PREGUNTA
========================================================= */

#tipoPregunta{
    position:absolute;
    left:32%;
    top:27.3%;
    width:36%;
    height:5%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:clamp(15px,1.55vw,29px);
    font-weight:900;
    text-align:center;
    text-shadow:2px 2px 3px #000;
    pointer-events:none;
    z-index:8;
}

#pregunta{
    position:absolute;
    left:13%;
    top:35%;
    width:58%;
    height:27%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2% 3%;
    text-align:center;
    color:#7b2cff;
    font-size:clamp(32px,3.5vw,68px);
    font-weight:900;
    line-height:1.15;
    -webkit-text-fill-color:#7b2cff;
    text-shadow:
        -2px -2px 0 #ffffff,
         2px -2px 0 #ffffff,
        -2px  2px 0 #ffffff,
         2px  2px 0 #ffffff,
         0 4px 0 rgba(31,20,120,.22);
    overflow:hidden;
    z-index:5;
}

/* =========================================================
   RESPUESTAS
========================================================= */

#respuestas{
    position:absolute;
    left:15.3%;
    top:64.0%;
    bottom:auto;
    width:61%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:2%;
    z-index:12;
}

.botonRespuesta{
    width:100%;
    height:12.7vh;
    min-height:70px;
    border:4px solid #65eaff;
    border-radius:20px;
    background:linear-gradient(145deg,#8c2cff,#5420bd);
    color:white;
    font-size:clamp(25px,3vw,56px);
    font-weight:900;
    text-shadow:2px 2px 3px #26005d;
    box-shadow:0 8px 0 #25127a,0 0 15px #00eaff;
    cursor:pointer;
    transition:transform .12s,box-shadow .12s,filter .12s;
}

.botonRespuesta:active{
    transform:translateY(7px) scale(.97);
    box-shadow:0 2px 0 #25127a,0 0 20px #fff;
}

.botonRespuesta:hover{filter:brightness(1.18);}
.botonRespuesta:disabled{cursor:default;}

/* =========================================================
   TU MISIÓN
========================================================= */

#panelMision{
    position:absolute;
    right:2.5%;
    top:31%;
    width:15.5%;
    height:36%;
    pointer-events:none;
    z-index:8;
}

.estrellaMision{
    position:absolute;
    width:30%;
    height:auto;
    object-fit:contain;
    opacity:.25;
    filter:grayscale(1) brightness(.7);
    transition:opacity .5s,filter .5s,transform .5s;
}

#estrella1{left:7%;top:0%;}
#estrella2{left:7%;top:32%;}
#estrella3{left:7%;top:64%;}

.estrellaMision.activa{
    opacity:1;
    filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #ffd700);
    transform:scale(1.12) rotate(5deg);
    animation:estrellaGanada .7s ease;
}

@keyframes estrellaGanada{
    0%{transform:scale(.2) rotate(-40deg);opacity:0;}
    60%{transform:scale(1.3) rotate(10deg);opacity:1;}
    100%{transform:scale(1.12) rotate(5deg);}
}

/* =========================================================
   ERROR
========================================================= */

#errorLuz{
    position:absolute;
    right:5.4%;
    top:61.8%;
    width:4.6%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:#551111;
    border:4px solid #ff5757;
    box-shadow:0 0 5px #ff0000;
    opacity:.25;
    transition:opacity .2s,box-shadow .2s;
    z-index:9;
}

#errorLuz.activo{
    opacity:1;
    background:#ff2020;
    box-shadow:0 0 10px #f00,0 0 25px #f00,0 0 40px #f55;
    animation:errorParpadeo .8s ease;
}

@keyframes errorParpadeo{
    0%,100%{transform:scale(1);}
    25%{transform:scale(1.3);}
    50%{transform:scale(.9);}
    75%{transform:scale(1.25);}
}

/* =========================================================
   MENSAJE
========================================================= */

#mensaje{
    position:absolute;
    left:10%;
    top:69%;
    width:61%;
    text-align:center;
    color:white;
    font-size:clamp(20px,2.1vw,40px);
    font-weight:900;
    text-shadow:2px 2px 3px #000;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
    z-index:20;
}

#mensaje.visible{opacity:1;}

/* =========================================================
   PANTALLA FINAL
========================================================= */

#pantallaFinal{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(5,5,60,.9);
    z-index:100;
}

#pantallaFinal.visible{display:flex;}

#pantallaFinal h1{
    color:#ffd700;
    font-size:clamp(34px,5vw,82px);
    text-align:center;
    text-shadow:0 0 10px #fff,0 0 30px #ffd700;
}

#pantallaFinal p{
    color:white;
    font-size:clamp(20px,3vw,50px);
    margin-top:20px;
    text-align:center;
}

#btnReiniciar{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:20px;
    background:#ff9d00;
    color:white;
    font-size:clamp(18px,2vw,35px);
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 6px 0 #a95100;
}

/* =========================================================
   TABLET HORIZONTAL
========================================================= */

@media (orientation:landscape) and (max-width:1200px){
    #pregunta{
        left:13%;
        top:35%;
        width:58%;
        height:27%;
        font-size:clamp(29px,3.25vw,56px);
    }

    #respuestas{
        left:15.3%;
        top:64.0%;
        bottom:auto;
        width:61%;
    }

    .botonRespuesta{
        height:12vh;
        font-size:clamp(21px,2.8vw,42px);
    }

    #panelMision{
        right:2.5%;
        top:31%;
        width:15.5%;
        height:36%;
    }
}

@media (orientation:landscape) and (max-height:650px){
    #pregunta{
        top:35%;
        height:27%;
        font-size:clamp(27px,2.9vw,48px);
    }

    .botonRespuesta{
        height:11vh;
        font-size:clamp(18px,2.5vw,34px);
    }

    #tipoPregunta{top:27%;}
}

@media (orientation:portrait){
    #juego::after{
        content:"↔ Gira la tablet a posición horizontal";
        position:absolute;
        inset:0;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#090c50;
        color:white;
        font-size:6vw;
        font-weight:bold;
        text-align:center;
        z-index:999;
    }
}
</style>

</head>


<body>

<div id="juego">

    <!-- Música de fondo -->
    <audio id="musicaFondo" loop autoplay preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
        <source src="fondo.mp3" type="audio/mpeg">
    </audio>

    <!-- =====================================================
         PUNTOS
    ====================================================== -->

    <div id="panelPuntos">

        <div id="textoPuntos">

            <small>PUNTOS</small>

            <span id="puntos">0</span>

        </div>

    </div>


    <!-- =====================================================
         NIVEL
    ====================================================== -->

    <div id="panelNivel">

        <span id="nivel">1 / 3</span>

    </div>


    <!-- =====================================================
         BOTÓN BLUETOOTH
    ====================================================== -->

    <button
        id="btnBluetooth"
        onclick="conectarBluetooth()"
        aria-label="Conectar Bluetooth">

        📡

    </button>


    <div
        id="estadoBluetooth"
        class="desconectado">

        Bluetooth opcional

    </div>


    <!-- =====================================================
         TIPO DE PREGUNTA
    ====================================================== -->

    <div id="tipoPregunta">

        🚀 ¡RESUELVE EL RETO!

    </div>


    <!-- =====================================================
         PREGUNTA
    ====================================================== -->

    <div id="pregunta">

        Preparando misión...

    </div>


    <!-- =====================================================
         PANEL TU MISIÓN
    ====================================================== -->

    <div id="panelMision">

        <!-- Las estrellas se cargan como imágenes independientes -->

        <img
            id="estrella1"
            class="estrellaMision"
            src="estrellitas.png"
            alt="Reto 1">

        <img
            id="estrella2"
            class="estrellaMision"
            src="estrellitas.png"
            alt="Reto 2">

        <img
            id="estrella3"
            class="estrellaMision"
            src="estrellitas.png"
            alt="Reto 3">

    </div>


    <!-- =====================================================
         INDICADOR DE ERROR
    ====================================================== -->

    <div id="errorLuz"></div>


    <!-- =====================================================
         MENSAJE
    ====================================================== -->

    <div id="mensaje"></div>


    <!-- =====================================================
         RESPUESTAS
    ====================================================== -->

    <div id="respuestas">

        <button
            class="botonRespuesta"
            onclick="responder(0)">
        </button>

        <button
            class="botonRespuesta"
            onclick="responder(1)">
        </button>

        <button
            class="botonRespuesta"
            onclick="responder(2)">
        </button>

        <button
            class="botonRespuesta"
            onclick="responder(3)">
        </button>

    </div>


    <!-- =====================================================
         PANTALLA FINAL
    ====================================================== -->

    <div id="pantallaFinal">

        <h1>🚀 ¡HAS LOGRADO ABRIR LA PUERTA! 🚀</h1>

        <p>
            ¡Misión completada! Has conseguido las 3 estrellas.
        </p>

        <p>
            🏆 Puntaje:
            <strong id="puntajeFinal">0</strong>
        </p>

        <button
            id="btnReiniciar"
            onclick="reiniciarJuego()">

            🔄 JUGAR DE NUEVO

        </button>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN BLUETOOTH ESP32
========================================================= */

/*
   IMPORTANTE:

   Estos UUID deben ser EXACTAMENTE iguales
   a los utilizados en el código del ESP32.

   Más adelante te daré el código del ESP32
   utilizando estos mismos UUID.
*/

const SERVICE_UUID =
    "12345678-1234-1234-1234-123456789abc";

const CHARACTERISTIC_UUID =
    "abcdefab-1234-1234-1234-123456789abc";


let dispositivoBLE = null;

let caracteristicaBLE = null;


/* =========================================================
   BANCO / GENERADOR DE PREGUNTAS
   Cada nivel mezcla ejercicios DIRECTOS y PROBLEMAS.
   Las cantidades se generan aleatoriamente.
========================================================= */

function numeroAleatorio(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function crearPregunta(nivel){
    const directa = Math.random() < 0.5;
    let a, b, respuesta, pregunta;

    if(nivel === 1){
        // 2 cifras × 1 cifra
        a = numeroAleatorio(10, 99);
        b = numeroAleatorio(2, 9);
        respuesta = a * b;

        if(directa){
            pregunta = `¿Cuánto es ${a} × ${b}?`;
        }else{
            const objetos = ["cuadernos","dulces","lápices","estudiantes","libros","juguetes"];
            const objeto = objetos[numeroAleatorio(0, objetos.length - 1)];
            pregunta = `Hay ${a} grupos y cada grupo tiene ${b} ${objeto}. ¿Cuántos ${objeto} hay en total?`;
        }
    }

    if(nivel === 2){
        // 2 cifras × 2 cifras
        a = numeroAleatorio(10, 99);
        b = numeroAleatorio(10, 99);
        respuesta = a * b;

        if(directa){
            pregunta = `¿Cuánto es ${a} × ${b}?`;
        }else{
            const objetos = ["cajas","paquetes","mesas","estantes","bolsas","filas"];
            const objeto = objetos[numeroAleatorio(0, objetos.length - 1)];
            pregunta = `Hay ${a} ${objeto} y en cada una hay ${b} unidades. ¿Cuántas unidades hay en total?`;
        }
    }

    if(nivel === 3){
        // 3 cifras × 2 cifras
        a = numeroAleatorio(100, 999);
        b = numeroAleatorio(10, 99);
        respuesta = a * b;

        if(directa){
            pregunta = `¿Cuánto es ${a} × ${b}?`;
        }else{
            const objetos = ["paquetes","cajas","tarjetas","cuadernos","juguetes","piezas"];
            const objeto = objetos[numeroAleatorio(0, objetos.length - 1)];
            pregunta = `Una escuela tiene ${a} paquetes con ${b} ${objeto} cada uno. ¿Cuántos ${objeto} hay en total?`;
        }
    }

    return {
        nivel,
        tipo: directa ? "directa" : "problema",
        pregunta,
        respuesta,
        clave: `${a}x${b}-${directa}`
    };
}

/* =========================================================
   VARIABLES DEL JUEGO
========================================================= */

let nivelActual = 1;
let puntos = 0;
let preguntaActual = null;
let preguntasUsadas = [];
let juegoTerminado = false;

/* =========================================================
   ELEMENTOS HTML
========================================================= */

const preguntaElemento = document.getElementById("pregunta");
const botones = document.querySelectorAll(".botonRespuesta");
const puntosElemento = document.getElementById("puntos");
const nivelElemento = document.getElementById("nivel");
const tipoPregunta = document.getElementById("tipoPregunta");
const mensajeElemento = document.getElementById("mensaje");
const errorLuz = document.getElementById("errorLuz");
const estrella1 = document.getElementById("estrella1");
const estrella2 = document.getElementById("estrella2");
const estrella3 = document.getElementById("estrella3");
const pantallaFinal = document.getElementById("pantallaFinal");
const puntajeFinal = document.getElementById("puntajeFinal");
const estadoBluetooth = document.getElementById("estadoBluetooth");

/* =========================================================
   INICIAR JUEGO
========================================================= */

function iniciarJuego(){
    nivelActual = 1;
    puntos = 0;
    juegoTerminado = false;
    preguntasUsadas = [];

    puntosElemento.textContent = "0";
    nivelElemento.textContent = "1 / 3";

    pantallaFinal.classList.remove("visible");
    estrella1.classList.remove("activa");
    estrella2.classList.remove("activa");
    estrella3.classList.remove("activa");
    errorLuz.classList.remove("activo");

    siguientePregunta();
}

/* =========================================================
   PREGUNTA ALEATORIA SIN REPETIR
========================================================= */

function obtenerPreguntaAleatoria(nivel){
    let pregunta;
    let intentos = 0;

    do{
        pregunta = crearPregunta(nivel);
        intentos++;
    }while(
        preguntasUsadas.includes(pregunta.clave) &&
        intentos < 50
    );

    preguntasUsadas.push(pregunta.clave);
    return pregunta;
}

/* =========================================================
   SIGUIENTE PREGUNTA
========================================================= */

function siguientePregunta(){
    if(nivelActual > 3){
        finalizarJuego();
        return;
    }

    preguntaActual = obtenerPreguntaAleatoria(nivelActual);

    nivelElemento.textContent = `${nivelActual} / 3`;

    tipoPregunta.textContent =
        preguntaActual.tipo === "directa"
        ? "🚀 ¡RESUELVE EL RETO DIRECTO!"
        : "🚀 ¡RESUELVE EL PROBLEMA!";

    preguntaElemento.textContent = preguntaActual.pregunta;

    mensajeElemento.classList.remove("visible");

    crearRespuestas();
}

/* =========================================================
   CREAR RESPUESTAS
========================================================= */

function crearRespuestas(){
    const correcta = preguntaActual.respuesta;
    const respuestas = generarRespuestas(correcta);

    respuestas.sort(() => Math.random() - 0.5);

    botones.forEach((boton, indice) => {
        boton.textContent = respuestas[indice].toLocaleString("es-SV");
        boton.disabled = false;
    });
}

/* =========================================================
   RESPUESTAS INCORRECTAS
========================================================= */

function generarRespuestas(correcta){
    const respuestas = new Set([correcta]);

    let diferencias;

    if(nivelActual === 1){
        diferencias = [1,2,3,5,7,10,12,15];
    }else if(nivelActual === 2){
        diferencias = [5,8,10,12,15,20,25,30,40];
    }else{
        diferencias = [20,30,40,50,75,100,125,150,200,250];
    }

    while(respuestas.size < 4){
        const diferencia =
            diferencias[numeroAleatorio(0, diferencias.length - 1)];

        const signo = Math.random() < 0.5 ? -1 : 1;
        const incorrecta = correcta + diferencia * signo;

        if(incorrecta > 0 && incorrecta !== correcta){
            respuestas.add(incorrecta);
        }
    }

    return Array.from(respuestas);
}

/* =========================================================
   RESPONDER
========================================================= */

function responder(indice){
    if(juegoTerminado) return;

    const valor = Number(
        botones[indice].textContent.replace(/\./g, "").replace(/,/g, "")
    );

    if(valor === preguntaActual.respuesta){
        respuestaCorrecta();
    }else{
        respuestaIncorrecta();
    }
}

/* =========================================================
   RESPUESTA CORRECTA
========================================================= */

function respuestaCorrecta(){
    botones.forEach(boton => boton.disabled = true);

    puntos += 100;
    puntosElemento.textContent = puntos;

    mostrarMensaje("⭐ ¡CORRECTO! +100 PUNTOS");
    activarEstrella(nivelActual);

    enviarBluetooth("Q" + nivelActual + "_OK");

    setTimeout(() => {
        nivelActual++;

        if(nivelActual <= 3){
            siguientePregunta();
        }else{
            finalizarJuego();
        }
    }, 1500);
}

/* =========================================================
   ACTIVAR ESTRELLA
========================================================= */

function activarEstrella(nivel){
    if(nivel === 1) estrella1.classList.add("activa");
    if(nivel === 2) estrella2.classList.add("activa");
    if(nivel === 3) estrella3.classList.add("activa");
}

/* =========================================================
   RESPUESTA INCORRECTA
========================================================= */

function respuestaIncorrecta(){
    mostrarMensaje("❌ ¡Respuesta incorrecta! Reiniciando misión...");

    errorLuz.classList.remove("activo");
    void errorLuz.offsetWidth;
    errorLuz.classList.add("activo");

    enviarBluetooth("ERROR");

    setTimeout(() => {
        errorLuz.classList.remove("activo");
        mensajeElemento.classList.remove("visible");

        nivelActual = 1;
        puntos = 0;
        preguntasUsadas = [];
        juegoTerminado = false;

        puntosElemento.textContent = "0";
        nivelElemento.textContent = "1 / 3";

        estrella1.classList.remove("activa");
        estrella2.classList.remove("activa");
        estrella3.classList.remove("activa");

        pantallaFinal.classList.remove("visible");

        enviarBluetooth("RESET");

        siguientePregunta();
        iniciarMusica();
    }, 1200);
}

/* =========================================================
   MENSAJE
========================================================= */

function mostrarMensaje(texto){
    mensajeElemento.textContent = texto;
    mensajeElemento.classList.add("visible");
}

/* =========================================================
   FINALIZAR
========================================================= */

function finalizarJuego(){
    juegoTerminado = true;

    puntajeFinal.textContent = puntos;
    pantallaFinal.classList.add("visible");

    // Detener completamente la música al completar la misión.
    detenerMusica();

    // Avisar al ESP32 que se completó el tercer reto.
    enviarBluetooth("Q3_OK");

    // Mostrar el mensaje durante 4 segundos y reiniciar automáticamente.
    setTimeout(() => {
        pantallaFinal.classList.remove("visible");
        iniciarJuego();
    }, 4000);
}

/* =========================================================
   REINICIAR
========================================================= */

function reiniciarJuego(){
    enviarBluetooth("RESET");
    iniciarJuego();
}

/* =========================================================
   BLUETOOTH BLE
========================================================= */

async function conectarBluetooth() {

    /*
       Verificar soporte
    */

    // Bluetooth es OPCIONAL: el juego funciona completamente sin conectarlo.
    if (!navigator.bluetooth) {
        estadoBluetooth.textContent = "Bluetooth no disponible";
        estadoBluetooth.className = "desconectado";
        return;
    }


    try {

        estadoBluetooth.textContent =
            "Buscando ESP32...";

        estadoBluetooth.className = "";


        /*
           Solicitar dispositivo
        */

        dispositivoBLE =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        namePrefix: "ESP32"
                    }
                ],

                optionalServices: [
                    SERVICE_UUID
                ]

            });


        estadoBluetooth.textContent =
            "Conectando...";


        /*
           Conectarse al ESP32
        */

        const servidor =
            await dispositivoBLE.gatt.connect();


        /*
           Obtener servicio
        */

        const servicio =
            await servidor.getPrimaryService(
                SERVICE_UUID
            );


        /*
           Obtener característica
        */

        caracteristicaBLE =
            await servicio.getCharacteristic(
                CHARACTERISTIC_UUID
            );


        /*
           Estado conectado
        */

        estadoBluetooth.textContent =
            "Bluetooth conectado";

        estadoBluetooth.className =
            "conectado";


        /*
           Si se pierde la conexión
        */

        dispositivoBLE.addEventListener(
            "gattserverdisconnected",
            bluetoothDesconectado
        );


        /*
           Enviar RESET al conectar
        */

        enviarBluetooth("RESET");


    } catch (error) {

        console.error(
            "Error Bluetooth:",
            error
        );

        estadoBluetooth.textContent =
            "Desconectado";

        estadoBluetooth.className =
            "desconectado";
    }
}


/* =========================================================
   BLUETOOTH DESCONECTADO
========================================================= */

function bluetoothDesconectado() {

    estadoBluetooth.textContent =
        "Bluetooth desconectado";

    estadoBluetooth.className =
        "desconectado";

    dispositivoBLE = null;

    caracteristicaBLE = null;
}


/* =========================================================
   ENVIAR DATOS AL ESP32
========================================================= */

async function enviarBluetooth(mensaje) {

    /*
       Si todavía no está conectado,
       simplemente no enviamos.
    */

    // Si no hay Bluetooth conectado, simplemente continuamos el juego.
    if (!caracteristicaBLE) {
        console.log("Bluetooth no conectado. Juego continúa normalmente:", mensaje);
        return;
    }


    try {

        const datos =
            new TextEncoder().encode(
                mensaje
            );


        await caracteristicaBLE
            .writeValue(datos);


        console.log(
            "Enviado al ESP32:",
            mensaje
        );


    } catch (error) {

        console.error(
            "Error enviando Bluetooth:",
            error
        );
    }
}


/* =========================================================
   MÚSICA DE FONDO
========================================================= */

const musicaFondo = document.getElementById("musicaFondo");
musicaFondo.volume = 0.35;
musicaFondo.autoplay = true;

function detenerMusica() {
    if (!musicaFondo) return;

    musicaFondo.pause();
    musicaFondo.currentTime = 0;
}

function iniciarMusica() {
    if (!musicaFondo) return;

    const promesa = musicaFondo.play();

    if (promesa !== undefined) {
        promesa.catch(() => {
            // Algunos navegadores bloquean audio con sonido al abrir
            // una página. En ese caso se intentará automáticamente
            // con la primera interacción del usuario.
        });
    }
}

// Intentar comenzar inmediatamente al cargar.
window.addEventListener("load", () => {
    iniciarMusica();
});

// Respaldo obligatorio para navegadores que bloquean autoplay con sonido.
["click", "touchstart", "keydown"].forEach(evento => {
    document.addEventListener(evento, iniciarMusica, { once: true });
});

// Si musica.mp3 no existe, probar automáticamente con fondo.mp3.
musicaFondo.addEventListener("error", () => {
    if (!musicaFondo.dataset.fallback) {
        musicaFondo.dataset.fallback = "1";
        musicaFondo.src = "fondo.mp3";
        musicaFondo.load();
        iniciarMusica();
    }
});

/* =========================================================
   INICIO AUTOMÁTICO
========================================================= */

window.addEventListener(
    "load",
    () => {

        iniciarJuego();

    }
);

</script>
